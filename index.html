<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Académika Plus - Mudanza Temporal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-500 via-teal-500 to-blue-600 flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <!-- Background Decorators -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-white opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 -right-20 w-80 h-80 bg-green-300 opacity-20 rounded-full blur-2xl"></div>

    <div class="bg-white/90 backdrop-blur-md p-10 md:p-14 rounded-[2rem] shadow-2xl max-w-lg w-full mx-4 text-center border border-white/40 transform transition-all hover:scale-[1.02] duration-500 relative z-10">
        
        <!-- Icon -->
        <div class="w-24 h-24 bg-gradient-to-tr from-green-400 to-teal-400 text-white rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-lg shadow-green-400/30 transform -rotate-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">¡Nos hemos mudado temporalmente!</h1>
        
        <p class="text-gray-600 mb-10 text-lg leading-relaxed">
            Estamos realizando mejoras. Hasta mientras puedes visitarnos en nuestra nueva plataforma temporal:
        </p>

        <a href="https://academikaplus-production.up.railway.app/" 
           class="group relative inline-flex items-center justify-center w-full px-8 py-4 text-lg font-bold text-white transition-all duration-200 bg-gray-900 border-2 border-transparent focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 rounded-xl overflow-hidden shadow-xl hover:shadow-2xl">
            <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
            <span class="relative flex items-center gap-2">
                Ir a: academikaplus-production.app
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </span>
        </a>
        
        <div class="mt-8 text-sm text-gray-400">
            Gracias por su paciencia.
        </div>
    </div>
</body>
</html>
